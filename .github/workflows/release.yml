
name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ make zip

      - name: Build englorus
        run: |
          cmake -S lab1/englorus -B build/englorus \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build build/englorus --parallel 2

      - name: Build polynomial
        run: |
          cmake -S lab1/polynomial -B build/polynomial \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build build/polynomial --parallel 2

      - name: Package executables
        run: |
          mkdir -p dist/englorus dist/polynomial

          find build/englorus -type f -executable \
            -not -path '*/CMakeFiles/*' \
            -exec cp --parents {} dist/englorus/ \;

          find build/polynomial -type f -executable \
            -not -path '*/CMakeFiles/*' \
            -exec cp --parents {} dist/polynomial/ \;

          cd dist
          zip -r ../release-linux.zip .

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-linux.zip
          generate_release_notes: true
